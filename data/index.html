<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FXI Panel de control</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="favicon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        /* mismos estilos que antes, solo añadimos nuevos para la barra apilada */
        :root {
            --bg-start: #0B3954;
            --bg-end: #061A2B;
            --glass-bg: rgba(20, 30, 50, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-sec: rgba(255, 255, 255, 0.6);
            --accent-cyan: #7AF0D4;
            --accent-blue: #EAE2D1;
            --chart-pink: #F06292;
            --chart-blue: #4FC3F7;
            --chart-green: #81C784;
            --flame-normal: #FFA726;
            --flame-danger: #FF3D00;
            --danger-glow: rgba(255, 61, 0, 0.6);
            --color-firmware: #3F51B5;
            --color-littlefs: #FFA726;
            --color-free: #7AF0D4;
        }
        /* ... mantén todos los estilos anteriores ... */
        /* Añadimos estilo para la barra apilada */
        .stacked-bar {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            height: 10px;
            margin-top: 8px;
            display: flex;
            overflow: hidden;
        }
        .segment-firmware { background-color: var(--color-firmware); height: 100%; }
        .segment-littlefs { background-color: var(--color-littlefs); height: 100%; }
        .segment-free { background-color: var(--color-free); height: 100%; }

        /* Ajuste para que la barra de RAM se vea */
        .progress-bar {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: var(--accent-cyan);
            height: 100%;
            width: 0%;
        }
    </style>
</head>
<body>
    <!-- todo el HTML igual hasta el stats-grid -->
    <!-- Cambiamos la parte de statsGrid para incluir la nueva barra combinada -->
    <script>
        // ... todas las funciones existentes hasta updateStatsUI
        async function updateStatsUI() {
            const info = await fetchInfo();
            if (!info) return;
            const statsGrid = document.getElementById('statsGrid');
            if (!statsGrid) return;

            // Datos de ejemplo si no vienen del ESP32 (para pruebas visuales)
            const sketchPercent = info.sketch_percent || 45;   // % ocupado por firmware
            const littlefsPercent = info.littlefs_percent || 23;
            const freePercent = 100 - (sketchPercent + littlefsPercent);
            // Cálculos en KB (totales aproximados)
            const sketchTotalKB = 1992; // 1.9 MB aprox
            const littlefsTotalKB = 128;
            const sketchUsedKB = (sketchPercent * sketchTotalKB) / 100;
            const littlefsUsedKB = (littlefsPercent * littlefsTotalKB) / 100;
            const totalKB = sketchTotalKB + littlefsTotalKB;
            const usedKB = sketchUsedKB + littlefsUsedKB;
            const freeKB = totalKB - usedKB;

            statsGrid.innerHTML = `
                <div class="stat-card"><div class="stat-label">Versión FW</div><div class="stat-value">${info.firmware || '--'}</div></div>
                <div class="stat-card"><div class="stat-label">Tiempo Encendido</div><div class="stat-value">${formatUptime(info.uptime || 0)}</div></div>
                <div class="stat-card">
                    <div class="stat-label">RAM (Heap)</div>
                    <div class="stat-value">${info.heap_percent || 0}%</div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${info.heap_percent || 0}%"></div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Almacenamiento Total (Flash)</div>
                    <div class="stat-value">${Math.round(usedKB)} KB / ${totalKB} KB (${Math.round(sketchPercent + littlefsPercent)}%)</div>
                    <div class="stacked-bar">
                        <div class="segment-firmware" style="width: ${sketchPercent}%;" title="Firmware: ${sketchPercent}% (${sketchUsedKB.toFixed(1)} KB)"></div>
                        <div class="segment-littlefs" style="width: ${littlefsPercent}%;" title="LittleFS: ${littlefsPercent}% (${littlefsUsedKB.toFixed(1)} KB)"></div>
                        <div class="segment-free" style="width: ${freePercent}%;" title="Libre: ${freePercent}% (${freeKB.toFixed(1)} KB)"></div>
                    </div>
                    <div style="font-size: 10px; margin-top: 4px;">
                        <span style="color: var(--color-firmware);">█ Firmware</span> 
                        <span style="color: var(--color-littlefs);">█ LittleFS</span> 
                        <span style="color: var(--color-free);">█ Libre</span>
                    </div>
                </div>
                <div class="stat-card"><div class="stat-label">IP Hotspot</div><div class="stat-value">${info.ip_ap || '--'}</div></div>
                <div class="stat-card"><div class="stat-label">IP Red externa</div><div class="stat-value">${info.ip_sta || '--'}</div></div>
                <div class="stat-card"><div class="stat-label">MQTT</div><div class="stat-value">${info.mqtt_status || '--'}</div></div>
                <div class="stat-card"><div class="stat-label">mDNS</div><div class="stat-value">${info.mdns || '--'}</div></div>
            `;
        }
        // ... resto del código igual
    </script>
</body>
</html>
