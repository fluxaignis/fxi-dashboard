<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>FXI Panel de control - Híbrido (MQTT + HTTP)</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="favicon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg-start: #0B3954;
            --bg-end: #061A2B;
            --glass-bg: rgba(20, 30, 50, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-sec: rgba(255, 255, 255, 0.6);
            --accent-cyan: #7AF0D4;
            --accent-blue: #EAE2D1;
            --chart-pink: #F06292;
            --chart-blue: #4FC3F7;
            --chart-orange: #FFA726;
            --flame-normal: #FFA726;
            --flame-danger: #FF3D00;
            --danger-glow: rgba(255, 61, 0, 0.6);
            --color-firmware: #7AF0D4;
            --color-littlefs: #FFA726;
            --color-free: rgba(0, 0, 0, 0.4);
            --status-online: #2e7d32;
            --status-offline: #c62828;
        }
        body.light-mode {
            --bg-start: #E0F2F1;
            --bg-end: #B2EBF2;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-main: #0B3954;
            --text-sec: rgba(11, 57, 84, 0.6);
            --danger-glow: rgba(255, 61, 0, 0.8);
        }
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s ease;
            /* Deshabilitar selección global */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
        /* Permitir selección solo en inputs y textareas */
        input, textarea {
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
        body.danger-alert .glass-card {
            box-shadow: 0 0 15px var(--danger-glow), 0 0 30px rgba(255, 61, 0, 0.3);
            border-color: var(--flame-danger);
        }
        body.potato-mode * {
            transition-duration: 0s !important;
            animation-duration: 0s !important;
            animation: none !important;
        }
        body.potato-mode .glass-card { backdrop-filter: none !important; }
        body.potato-mode #weather-canvas { display: none !important; }
        body.potato-mode #trendCard,
        body.potato-mode #adminCard,
        body.potato-mode #configCard,
        body.potato-mode #coverageCard,
        body.potato-mode #downloadBtn,
        body.potato-mode .range-buttons,
        body.potato-mode .legend,
        body.potato-mode .avg-text { display: none !important; }
        body.potato-mode .flame-icon.danger { animation: none !important; }

        body.watch-mode { padding: 10px; }
        body.watch-mode .main-content { max-width: 100%; padding: 10px; }
        body.watch-mode .dashboard-grid { grid-template-columns: 1fr; gap: 10px; }
        body.watch-mode .left-column, body.watch-mode .right-column { gap: 10px; }
        body.watch-mode .glass-card { padding: 12px; border-radius: 18px; }
        body.watch-mode .fxi-logo { font-size: 20px; }
        body.watch-mode .val-big { font-size: clamp(30px, 10vw, 42px); }
        body.watch-mode .val-med { font-size: 22px; }
        body.watch-mode .flame-icon { font-size: 42px; }
        body.watch-mode .header { margin-bottom: 15px; }
        body.watch-mode #trendCard,
        body.watch-mode #levelsCard,
        body.watch-mode #adminCard,
        body.watch-mode #configCard,
        body.watch-mode #coverageCard,
        body.watch-mode #rssiCard,
        body.watch-mode #netStatusCard,
        body.watch-mode #reconnectBtn,
        body.watch-mode #resetAlertBtnSquare,
        body.watch-mode #btnServoCard,
        body.watch-mode #downloadBtn { display: none !important; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 10px; }
        #weather-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; image-rendering: auto;
        }
        .main-content {
            position: relative; z-index: 2;
            max-width: 1200px; margin: 0 auto;
            padding: 40px 20px;
            display: flex; flex-direction: column;
        }
        .header {
            display: flex; align-items: center; margin-bottom: 35px;
            flex-wrap: wrap; gap: 15px;
        }
        .fxi-logo {
            font-weight: 900; font-size: 32px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-right: auto;
        }
        .header-buttons { display: flex; align-items: center; gap: 5px; }
        .header-buttons > div {
            cursor: pointer; font-size: 26px;
            transition: transform 0.2s; user-select: none; margin-left: 10px;
        }
        .header-buttons > div:hover { transform: scale(1.2); }

        .dashboard-grid { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 25px; }
        .left-column, .right-column { display: flex; flex-direction: column; gap: 25px; }
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); }
        @media (max-width: 768px) { .glass-card { backdrop-filter: none; } }
        @media (min-width: 769px) { .glass-card { backdrop-filter: blur(12px); } }
        .card-title {
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            color: var(--text-sec); margin-bottom: 10px; letter-spacing: 1px;
        }
        .val-big { font-size: clamp(38px, 7vw, 58px); font-weight: 200; }
        .val-med { font-size: 28px; font-weight: 500; }
        .unit { font-size: 14px; opacity: 0.7; }
        .chart-container { height: 110px; display: flex; align-items: flex-end; justify-content: space-around; margin-top: 15px; }
        .bar-group { width: 50px; text-align: center; }
        .bar-bg { height: 80px; background: rgba(0,0,0,0.2); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
        .bar-fill { width: 100%; transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-glass {
            background: rgba(255,255,255,0.05); border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan); padding: 12px 18px; border-radius: 18px;
            font-weight: 700; cursor: pointer; transition: all 0.3s ease;
            text-align: center; width: 100%; font-size: 14px; box-sizing: border-box;
        }
        .btn-glass:hover { background: rgba(122,240,212,0.15); transform: translateY(-2px); }
        .btn-servo {
            background: rgba(255,255,255,0.05); border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan); padding: 10px 18px; border-radius: 18px;
            cursor: pointer; width: 100%; transition: all 0.3s; font-weight: 800; user-select: none;
        }
        .btn-servo.active { background: var(--accent-cyan); color: #0B3954; box-shadow: 0 0 20px rgba(122,240,212,0.4); }
        .btn-servo:hover { background: rgba(122,240,212,0.1); transform: translateY(-2px); }
        .status-badge {
            display: inline-block; padding: 4px 12px; border-radius: 40px;
            font-size: 11px; font-weight: bold; color: white;
            background-color: var(--status-online); margin-left: 8px; text-transform: uppercase;
        }
        .status-badge.offline { background-color: var(--status-offline); }
        .flame-card { text-align: center; cursor: pointer; }
        .flame-icon { font-size: 68px; transition: all 0.3s ease; filter: drop-shadow(0 0 5px rgba(0,0,0,0.3)); }
        .flame-icon.normal { color: var(--flame-normal); text-shadow: 0 0 5px #FFA726; }
        .flame-icon.danger { color: var(--flame-danger); text-shadow: 0 0 20px #FF3D00; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        .flame-status { font-size: 18px; font-weight: bold; margin-top: 8px; }
        .chart-wrapper { margin-top: 15px; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 8px; }
        .svg-chart { width: 100%; height: 170px; background: transparent; }
        .range-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .range-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan); padding: 4px 12px; border-radius: 20px;
            cursor: pointer; font-size: 11px; transition: background 0.2s, color 0.2s;
        }
        .range-btn.active { background: var(--accent-cyan); color: #0B3954; }
        .avg-text { font-size: 11px; text-align: center; margin-top: 10px; color: var(--text-sec); }
        .legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 5px; font-size: 11px; }
        .legend-temp { color: #F06292; } .legend-hum { color: #4FC3F7; } .legend-gas { color: #FFA726; }
        .double-card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .admin-card { transition: all 0.4s; cursor: pointer; overflow: hidden; height: fit-content; }
        .admin-card .admin-reduced { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .admin-card .admin-expanded { display: none; }
        .admin-card.expanded .admin-reduced { display: none; }
        .admin-card.expanded .admin-expanded { display: block; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .admin-section { background: rgba(0,0,0,0.25); border-radius: 20px; margin-bottom: 18px; overflow: hidden; }
        .admin-section-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; cursor: pointer; background: rgba(255,255,255,0.03); user-select: none;
        }
        .admin-section-header:hover { background: rgba(255,255,255,0.08); }
        .admin-section-title { font-weight: 600; font-size: 13px; color: var(--accent-cyan); }
        .admin-section-icon { transition: transform 0.3s ease; font-size: 12px; }
        .admin-section-content { padding: 16px; border-top: 1px solid rgba(255,255,255,0.05); display: none; }
        .admin-section.open .admin-section-content { display: block; }
        .admin-section.open .admin-section-icon { transform: rotate(90deg); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .stat-card { background: rgba(0,0,0,0.25); border-radius: 16px; padding: 10px; text-align: center; }
        .stat-label { font-size: 9px; text-transform: uppercase; color: var(--text-sec); }
        .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; word-break: break-word; }
        .progress-bar { background: rgba(0,0,0,0.4); border-radius: 6px; height: 5px; margin-top: 8px; overflow: hidden; }
        .progress-fill { background: var(--accent-cyan); height: 100%; width: 0%; }
        .stacked-bar { background: rgba(0,0,0,0.4); border-radius: 6px; height: 7px; margin-top: 8px; display: flex; overflow: hidden; }
        .segment-firmware { background-color: var(--color-firmware); }
        .segment-littlefs { background-color: var(--color-littlefs); }
        .segment-free { background-color: var(--color-free); }
        .action-blocks { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
        .action-block {
            background: rgba(0,0,0,0.3); border-radius: 20px; padding: 10px 6px;
            text-align: center; cursor: pointer; transition: all 0.2s; border: 1px solid rgba(122,240,212,0.2);
        }
        .action-block:hover { background: rgba(122,240,212,0.15); transform: translateY(-3px); border-color: var(--accent-cyan); }
        .action-icon { font-size: 22px; display: block; margin-bottom: 4px; }
        .action-label { font-size: 11px; }
        .ping-graph { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 8px; height: 90px; }
        #pingCanvas { width: 100%; height: 70px; background: rgba(0,0,0,0.2); border-radius: 12px; }
        .log-container {
            background: rgba(0,0,0,0.4); border-radius: 16px; padding: 8px;
            max-height: 250px; overflow-y: auto; font-family: monospace; font-size: 11px;
        }
        .log-entry { margin: 4px 0; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,0.2); border-left: 3px solid; cursor: help; }
        .log-info { border-left-color: #4FC3F7; } .log-warn { border-left-color: #FFD54F; color: #FFD54F; }
        .log-error { border-left-color: #F06292; color: #F06292; } .log-alert { border-left-color: #FF3D00; color: #FF3D00; }
        .log-timestamp { display: none; color: var(--text-sec); font-size: 9px; margin-right: 8px; }
        .log-timestamp.visible { display: inline; }
        .toggle-timestamp { background: none; border: none; color: var(--accent-cyan); cursor: pointer; font-size: 10px; margin-bottom: 8px; text-decoration: underline; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 1000;
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 28px;
            padding: 24px; max-width: 360px; width: 85%; backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .modal-content h3 { margin-top: 0; color: var(--accent-cyan); }
        .modal-content input {
            width: 100%; padding: 12px; margin: 12px 0;
            background: rgba(0,0,0,0.5); border: 1px solid var(--accent-cyan); border-radius: 28px;
            color: var(--text-main); font-size: 14px; outline: none; box-sizing: border-box;
        }
        .modal-content input:focus { border-color: var(--accent-blue); box-shadow: 0 0 8px var(--accent-cyan); }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-buttons button { padding: 8px 20px; border-radius: 40px; border: none; cursor: pointer; font-weight: bold; }
        .modal-buttons button:first-child { background: var(--accent-cyan); color: #0B3954; }
        .modal-buttons button:last-child { background: var(--chart-pink); color: white; }
        .toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 10px 22px; border-radius: 40px; font-weight: bold;
            z-index: 1100; opacity: 0; transition: opacity 0.3s;
            pointer-events: none; white-space: nowrap; font-size: 13px;
        }
        .toast.show { opacity: 1; }
        @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } .double-card-row { grid-template-columns: 1fr; gap: 20px; } }
        @media (max-width: 500px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-buttons { margin-left: 0; }
            .double-card-row { gap: 15px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }

        .config-input {
            background: rgba(0,0,0,0.3); border: 1px solid var(--accent-cyan); border-radius: 12px;
            color: var(--text-main); padding: 6px 10px; width: 80px; font-size: 13px; text-align: center;
        }
        .config-label { font-size: 12px; margin-right: 8px; }
        .config-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

        #coverageSVG { width: 200px; height: 200px; display: block; margin: 0 auto; }
        .sweep-active { animation: radarSweep 2s linear infinite; }
        @keyframes radarSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sector-fire { fill: rgba(255, 61, 0, 0.8) !important; animation: fireGlow 0.5s infinite alternate; }
        @keyframes fireGlow { from { fill: rgba(255, 61, 0, 0.7); } to { fill: rgba(255, 160, 0, 0.9); } }
    </style>
</head>
<body>
    <canvas id="weather-canvas"></canvas>
    <div class="main-content">
        <div class="header">
            <div class="fxi-logo">FLUXA IGNIS</div>
            <div>
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                    <span style="font-weight: 600;">Módulo ESP32</span>
                    <span id="esp-status" class="status-badge">Inicializando...</span>
                </div>
                <div style="font-size: 11px; color: var(--text-sec);" id="modo-indicador">Modo: --</div>
            </div>
            <div class="header-buttons">
                <div id="watch-toggle" title="Modo Reloj (wearable)">⌚</div>
                <div id="potato-toggle" title="Modo Papa (extrema optimización)">🥔</div>
                <div id="bg-toggle" title="Desactivar fondo animado">✨</div>
                <div id="theme-toggle" title="Cambiar tema">✳</div>
            </div>
        </div>

        <!-- El resto del cuerpo (tarjetas, columnas, etc.) se mantiene idéntico al último HTML que funcionaba, solo he mostrado el CSS y el header para mantener el foco. -->
        <!-- ... (todo el HTML del panel) ... -->
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Acceso restringido</h3>
            <div id="modalBody">Contraseña de administrador:</div>
            <input type="password" id="modalInput" placeholder="Contraseña" autocomplete="off">
            <div class="modal-buttons">
                <button id="modalConfirm">Confirmar</button>
                <button id="modalCancel">Cancelar</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast">Mensaje</div>

    <script>
        (function() {
            // ... (todo el JavaScript del último HTML funcional)
        })();
    </script>
</body>
</html>
