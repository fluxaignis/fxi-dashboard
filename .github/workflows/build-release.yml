name: Build and Release ESP32 Firmware

on:
  push:
    branches: [ "main" ]      # Se activa cuando subes cambios a la rama "main"
  workflow_dispatch:          # También permite ejecutarlo manualmente desde la web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Arduino CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
        export PATH=$PATH:$HOME/bin

    - name: Install ESP32 platform
      run: |
        arduino-cli core update-index
        arduino-cli core install esp32:esp32

    - name: Install required libraries
      run: |
        arduino-cli lib install "DHT sensor library"
        arduino-cli lib install "PubSubClient"
        arduino-cli lib install "ESP32Servo"
        # Si usas otras librerías, agrégalas aquí

    - name: Compile firmware
      run: |
        mkdir -p output
        arduino-cli compile --fqbn esp32:esp32:esp32:FlashFreq=80,PartitionScheme=default,UploadSpeed=921600 firmware/fxi-esp32.ino --output-dir ./output

    - name: Rename binary (GitHub OTA expects a specific name)
      run: |
        # El binario generado se llamará algo como fxi-esp32.ino.bin
        # Lo renombramos a fxi-esp32.bin para que coincida con el código.
        mv output/fxi-esp32.ino.bin output/fxi-esp32.bin

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Firmware v${{ github.run_number }}
        files: output/fxi-esp32.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
