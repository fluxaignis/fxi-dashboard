name: Compilar y publicar firmware ESP32

on:
  push:
    branches:
      - main
    paths:
      - 'fxi-dashboard.ino'
      - '*.h'
      - 'data/index.html'        # también reacciona a cambios en el HTML
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configurar plataforma ESP32
        run: |
          arduino-cli core update-index
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Instalar Librerías
        run: |
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "ArduinoJson"

      - name: Obtener versión (número de ejecución)
        id: vars
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Inyectar versión y compilar
        run: |
          sed -i "s/AUTO_VERSION/${{ steps.vars.outputs.VERSION }}/g" fxi-dashboard.ino
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build fxi-dashboard.ino

      - name: Preparar binario y version.txt
        run: |
          cp ./build/fxi-dashboard.ino.bin ./firmware.bin
          echo "${{ steps.vars.outputs.VERSION }}" > version.txt

      - name: Copiar HTML optimizado a subcarpeta para gh-pages
        run: |
          mkdir -p esp32
          cp data/index.html esp32/

      - name: Subir firmware, versión y HTML a rama gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          keep_files: false
          force_orphan: true                                      # Fuerza la sobrescritura completa
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Actualizar firmware ${{ steps.vars.outputs.VERSION }}"
